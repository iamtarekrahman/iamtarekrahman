<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 70" width="800" height="70">
  <defs>
    <linearGradient id="gearGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A4A4A"/>
      <stop offset="100%" style="stop-color:#2A2A2A"/>
    </linearGradient>
    <filter id="glowGear2">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Connecting shaft line -->
  <line x1="0" y1="35" x2="800" y2="35" stroke="#FF6B00" stroke-width="0.5" opacity="0.3"/>

  <!-- Planetary Gear Set 1 (left) - Ring gear + Sun gear + Planet gears -->
  <g transform="translate(150, 35)" filter="url(#glowGear2)">
    <!-- Ring gear (outer, stationary) -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#FF6B00" stroke-width="2" stroke-dasharray="5 3"/>
    <!-- Sun gear (center, rotating) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="10" fill="url(#gearGrad2)" stroke="#FF8C00" stroke-width="1.5" stroke-dasharray="3 2"/>
      <line x1="-10" y1="0" x2="10" y2="0" stroke="#FFAA00" stroke-width="1"/>
      <line x1="0" y1="-10" x2="0" y2="10" stroke="#FFAA00" stroke-width="1"/>
      <circle cx="0" cy="0" r="3" fill="#FF6B00"/>
    </g>
    <!-- Planet gear 1 (orbiting) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite"/>
      <g transform="translate(19, 0)">
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="2s" repeatCount="indefinite"/>
        <circle cx="0" cy="0" r="7" fill="url(#gearGrad2)" stroke="#FF8C00" stroke-width="1.2" stroke-dasharray="3 2"/>
        <line x1="-7" y1="0" x2="7" y2="0" stroke="#FFAA00" stroke-width="0.8"/>
        <circle cx="0" cy="0" r="2" fill="#FF6B00"/>
      </g>
    </g>
    <!-- Planet gear 2 (orbiting, offset 120deg) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="120 0 0" to="480 0 0" dur="6s" repeatCount="indefinite"/>
      <g transform="translate(19, 0)">
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="2s" repeatCount="indefinite"/>
        <circle cx="0" cy="0" r="7" fill="url(#gearGrad2)" stroke="#FF8C00" stroke-width="1.2" stroke-dasharray="3 2"/>
        <line x1="-7" y1="0" x2="7" y2="0" stroke="#FFAA00" stroke-width="0.8"/>
        <circle cx="0" cy="0" r="2" fill="#FF6B00"/>
      </g>
    </g>
    <!-- Planet gear 3 (orbiting, offset 240deg) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="240 0 0" to="600 0 0" dur="6s" repeatCount="indefinite"/>
      <g transform="translate(19, 0)">
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="2s" repeatCount="indefinite"/>
        <circle cx="0" cy="0" r="7" fill="url(#gearGrad2)" stroke="#FF8C00" stroke-width="1.2" stroke-dasharray="3 2"/>
        <line x1="-7" y1="0" x2="7" y2="0" stroke="#FFAA00" stroke-width="0.8"/>
        <circle cx="0" cy="0" r="2" fill="#FF6B00"/>
      </g>
    </g>
  </g>

  <!-- Shaft connecting set 1 to set 2 -->
  <rect x="180" y="33" width="100" height="4" rx="2" fill="#2D2D2D" stroke="#FF6B00" stroke-width="0.8"/>
  <!-- Shaft bearing -->
  <circle cx="230" cy="35" r="5" fill="#1a1a1a" stroke="#FF8C00" stroke-width="1"/>
  <circle cx="230" cy="35" r="2" fill="#FF6B00"/>

  <!-- Worm Gear Set (center) -->
  <g transform="translate(400, 35)">
    <!-- Worm (horizontal helix) -->
    <rect x="-40" y="-5" width="80" height="10" rx="5" fill="url(#gearGrad2)" stroke="#FF6B00" stroke-width="1.2"/>
    <!-- Helix grooves (animated) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;12,0" dur="1s" repeatCount="indefinite"/>
      <line x1="-40" y1="-4" x2="-34" y2="4" stroke="#FF8C00" stroke-width="1" opacity="0.7"/>
      <line x1="-28" y1="-4" x2="-22" y2="4" stroke="#FF8C00" stroke-width="1" opacity="0.7"/>
      <line x1="-16" y1="-4" x2="-10" y2="4" stroke="#FF8C00" stroke-width="1" opacity="0.7"/>
      <line x1="-4" y1="-4" x2="2" y2="4" stroke="#FF8C00" stroke-width="1" opacity="0.7"/>
      <line x1="8" y1="-4" x2="14" y2="4" stroke="#FF8C00" stroke-width="1" opacity="0.7"/>
      <line x1="20" y1="-4" x2="26" y2="4" stroke="#FF8C00" stroke-width="1" opacity="0.7"/>
      <line x1="32" y1="-4" x2="38" y2="4" stroke="#FF8C00" stroke-width="1" opacity="0.7"/>
      <line x1="44" y1="-4" x2="50" y2="4" stroke="#FF8C00" stroke-width="1" opacity="0.7"/>
    </g>
    <!-- Worm wheel (perpendicular, shown from side) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="4" ry="25" fill="none" stroke="#FF6B00" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="2" ry="22" fill="none" stroke="#FF8C00" stroke-width="1" stroke-dasharray="4 3"/>
    </g>
  </g>

  <!-- Shaft connecting center to set 3 -->
  <rect x="440" y="33" width="100" height="4" rx="2" fill="#2D2D2D" stroke="#FF6B00" stroke-width="0.8"/>
  <circle cx="490" cy="35" r="5" fill="#1a1a1a" stroke="#FF8C00" stroke-width="1"/>
  <circle cx="490" cy="35" r="2" fill="#FF6B00"/>

  <!-- Bevel Gear Set (right) -->
  <g transform="translate(650, 35)" filter="url(#glowGear2)">
    <!-- Bevel gear 1 (angled disc) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3s" repeatCount="indefinite"/>
      <ellipse cx="-8" cy="0" rx="8" ry="20" fill="none" stroke="#FF6B00" stroke-width="2" stroke-dasharray="4 3"/>
      <line x1="-8" y1="-20" x2="-8" y2="20" stroke="#FF8C00" stroke-width="1"/>
      <line x1="-16" y1="0" x2="0" y2="0" stroke="#FF8C00" stroke-width="1"/>
      <circle cx="-8" cy="0" r="4" fill="#1a1a1a" stroke="#FF8C00" stroke-width="1"/>
      <circle cx="-8" cy="0" r="1.5" fill="#FF6B00"/>
    </g>
    <!-- Bevel gear 2 (perpendicular) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 8 0" to="360 8 0" dur="3s" repeatCount="indefinite"/>
      <ellipse cx="8" cy="0" rx="8" ry="20" fill="none" stroke="#FF6B00" stroke-width="2" stroke-dasharray="4 3"/>
      <line x1="8" y1="-20" x2="8" y2="20" stroke="#FF8C00" stroke-width="1"/>
      <line x1="0" y1="0" x2="16" y2="0" stroke="#FF8C00" stroke-width="1"/>
      <circle cx="8" cy="0" r="4" fill="#1a1a1a" stroke="#FF8C00" stroke-width="1"/>
      <circle cx="8" cy="0" r="1.5" fill="#FF6B00"/>
    </g>
    <!-- Meshing sparks -->
    <circle cx="0" cy="0" r="2" fill="#FFAA00">
      <animate attributeName="opacity" values="0;1;0" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1;3;1" dur="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Oil drip particles -->
  <circle cx="230" cy="42" r="1.5" fill="#FFAA00" opacity="0.5">
    <animate attributeName="cy" values="40;50;40" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="490" cy="42" r="1.5" fill="#FFAA00" opacity="0.5">
    <animate attributeName="cy" values="40;50;40" dur="2s" begin="0.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
</svg>