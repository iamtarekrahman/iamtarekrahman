<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" width="800" height="60">
  <defs>
    <linearGradient id="chainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#666"/>
      <stop offset="50%" style="stop-color:#333"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <filter id="glowChain">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sprocket 1 (left) -->
  <g filter="url(#glowChain)">
    <animateTransform attributeName="transform" type="rotate" from="0 80 30" to="360 80 30" dur="3s" repeatCount="indefinite"/>
    <!-- Teeth -->
    <circle cx="80" cy="30" r="18" fill="none" stroke="#FF6B00" stroke-width="2" stroke-dasharray="6 4"/>
    <!-- Spokes -->
    <line x1="80" y1="12" x2="80" y2="48" stroke="#FF8C00" stroke-width="1.5"/>
    <line x1="62" y1="30" x2="98" y2="30" stroke="#FF8C00" stroke-width="1.5"/>
    <line x1="67" y1="17" x2="93" y2="43" stroke="#FF8C00" stroke-width="1.5"/>
    <line x1="67" y1="43" x2="93" y2="17" stroke="#FF8C00" stroke-width="1.5"/>
    <!-- Hub -->
    <circle cx="80" cy="30" r="6" fill="#1a1a1a" stroke="#FF6B00" stroke-width="2"/>
    <circle cx="80" cy="30" r="2.5" fill="#FF6B00"/>
  </g>

  <!-- Sprocket 2 (right) -->
  <g filter="url(#glowChain)">
    <animateTransform attributeName="transform" type="rotate" from="0 720 30" to="360 720 30" dur="3s" repeatCount="indefinite"/>
