    <line x1="720" y1="12" x2="720" y2="48" stroke="#FF8C00" stroke-width="1.5"/>
    <line x1="702" y1="30" x2="738" y2="30" stroke="#FF8C00" stroke-width="1.5"/>
    <line x1="707" y1="17" x2="733" y2="43" stroke="#FF8C00" stroke-width="1.5"/>
    <line x1="707" y1="43" x2="733" y2="17" stroke="#FF8C00" stroke-width="1.5"/>
    <circle cx="720" cy="30" r="6" fill="#1a1a1a" stroke="#FF6B00" stroke-width="2"/>
    <circle cx="720" cy="30" r="2.5" fill="#FF6B00"/>
  </g>

