<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" width="800" height="60">
  <defs>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B00;stop-opacity:0.2"/>
      <stop offset="50%" style="stop-color:#FF8C00;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#FF6B00;stop-opacity:0.2"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#555"/>
      <stop offset="100%" style="stop-color:#2A2A2A"/>
    </linearGradient>
    <filter id="glowCar">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Road surface -->
  <rect x="0" y="45" width="800" height="8" rx="2" fill="#1a1a1a" stroke="#FF6B00" stroke-width="0.5" opacity="0.8"/>

  <!-- Road dashes (animated) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;-40,0" dur="0.5s" repeatCount="indefinite"/>
    <rect x="0" y="48" width="20" height="2" fill="#FF8C00" opacity="0.6"/>
    <rect x="40" y="48" width="20" height="2" fill="#FF8C00" opacity="0.6"/>
    <rect x="80" y="48" width="20" height="2" fill="#FF8C00" opacity="0.6"/>
    <rect x="120" y="48" width="20" height="2" fill="#FF8C00" opacity="0.6"/>
    <rect x="160" y="48" width="20" height="2" fill="#FF8C00" opacity="0.6"/>
    <rect x="200" y="48" width="20" height="2" fill="#FF8C00" opacity="0.6"/>
    <rect x="240" y="48" width="20" height="2" fill="#FF8C00" opacity="0.6"/>
    <rect x="280" y="48" width="20" height="2" fill="#FF8C00" opacity="0.6"/>
    <rect x="320" y="48" width="20" height="2" fill="#FF8C00" opacity="0.6"/>
    <rect x="360" y="48" width="20" height="2" fill="#FF8C00" opacity="0.6"/>
    <rect x="400" y="48" width="20" height="2" fill="#FF8C00" opacity="0.6"/>
    <rect x="440" y="48" width="20" height="2" fill="#FF8C00" opacity="0.6"/>
    <rect x="480" y="48" width="20" height="2" fill="#FF8C00" opacity="0.6"/>
    <rect x="520" y="48" width="20" height="2" fill="#FF8C00" opacity="0.6"/>
    <rect x="560" y="48" width="20" height="2" fill="#FF8C00" opacity="0.6"/>
    <rect x="600" y="48" width="20" height="2" fill="#FF8C00" opacity="0.6"/>
    <rect x="640" y="48" width="20" height="2" fill="#FF8C00" opacity="0.6"/>
    <rect x="680" y="48" width="20" height="2" fill="#FF8C00" opacity="0.6"/>
    <rect x="720" y="48" width="20" height="2" fill="#FF8C00" opacity="0.6"/>
    <rect x="760" y="48" width="20" height="2" fill="#FF8C00" opacity="0.6"/>
    <rect x="800" y="48" width="20" height="2" fill="#FF8C00" opacity="0.6"/>
    <rect x="840" y="48" width="20" height="2" fill="#FF8C00" opacity="0.6"/>
  </g>

  <!-- Car (moving right) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-180,0;850,0" dur="8s" repeatCount="indefinite"/>

    <!-- Car body -->
    <path d="M20,30 L25,20 L55,16 L90,16 L110,20 L115,30 L120,33 L120,42 L10,42 L10,33 Z" fill="url(#carBody)" stroke="#FF6B00" stroke-width="1.2"/>

    <!-- Windows -->
    <path d="M30,21 L55,18 L55,30 L28,30 Z" fill="#1a1a1a" stroke="#FF8C00" stroke-width="0.8" opacity="0.8"/>
    <path d="M58,18 L88,18 L90,21 L90,30 L58,30 Z" fill="#1a1a1a" stroke="#FF8C00" stroke-width="0.8" opacity="0.8"/>

    <!-- Headlight -->
    <rect x="117" y="33" width="6" height="4" rx="1" fill="#FFAA00" filter="url(#glowCar)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="0.8s" repeatCount="indefinite"/>
    </rect>

    <!-- Taillight -->
    <rect x="8" y="33" width="4" height="4" rx="1" fill="#FF3300" filter="url(#glowCar)"/>

    <!-- Front wheel -->
    <circle cx="95" cy="44" r="7" fill="#1a1a1a" stroke="#FF6B00" stroke-width="1.5"/>
    <line x1="95" y1="37" x2="95" y2="51" stroke="#FF8C00" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" from="0 95 44" to="360 95 44" dur="0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="88" y1="44" x2="102" y2="44" stroke="#FF8C00" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" from="0 95 44" to="360 95 44" dur="0.4s" repeatCount="indefinite"/>
    </line>
    <circle cx="95" cy="44" r="2.5" fill="#FF6B00"/>

    <!-- Rear wheel -->
    <circle cx="35" cy="44" r="7" fill="#1a1a1a" stroke="#FF6B00" stroke-width="1.5"/>
    <line x1="35" y1="37" x2="35" y2="51" stroke="#FF8C00" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" from="0 35 44" to="360 35 44" dur="0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="28" y1="44" x2="42" y2="44" stroke="#FF8C00" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" from="0 35 44" to="360 35 44" dur="0.4s" repeatCount="indefinite"/>
    </line>
    <circle cx="35" cy="44" r="2.5" fill="#FF6B00"/>
  </g>
</svg>