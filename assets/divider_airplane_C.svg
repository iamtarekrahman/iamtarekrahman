<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" width="800" height="80">
  <defs>
    <linearGradient id="runwayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B00;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#FF6B00;stop-opacity:0"/>
    </linearGradient>
    <filter id="glowPlane3">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Runway -->
  <rect x="0" y="62" width="250" height="6" rx="1" fill="#2D2D2D" stroke="#FF6B00" stroke-width="0.8"/>
  <!-- Runway markings -->
  <rect x="20" y="64" width="15" height="2" fill="#FF8C00" opacity="0.6"/>
  <rect x="50" y="64" width="15" height="2" fill="#FF8C00" opacity="0.6"/>
  <rect x="80" y="64" width="15" height="2" fill="#FF8C00" opacity="0.6"/>
  <rect x="110" y="64" width="15" height="2" fill="#FF8C00" opacity="0.6"/>
  <rect x="140" y="64" width="15" height="2" fill="#FF8C00" opacity="0.6"/>
  <rect x="170" y="64" width="15" height="2" fill="#FF8C00" opacity="0.6"/>
  <rect x="200" y="64" width="15" height="2" fill="#FF8C00" opacity="0.6"/>

  <!-- Takeoff curve (dotted trajectory) -->
  <path d="M 220,60 C 350,55 450,35 780,8" fill="none" stroke="#FF6B00" stroke-width="1" stroke-dasharray="5 5" opacity="0.4">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- Airplane taking off along curve -->
  <g filter="url(#glowPlane3)">
    <animateMotion dur="4s" repeatCount="indefinite" rotate="auto" path="M 20,62 L 220,60 C 350,55 450,35 780,8"/>

    <!-- Main body (larger, more detailed) -->
    <path d="M-25,0 L20,-1.5 L25,0 L20,1.5 L-25,0 Z" fill="#2D2D2D" stroke="#FF6B00" stroke-width="1.2"/>

    <!-- Wings -->
    <path d="M-2,-1.5 L5,-10 L12,-10 L8,-1.5 Z" fill="#3A3A3A" stroke="#FF8C00" stroke-width="0.8"/>
    <path d="M-2,1.5 L5,10 L12,10 L8,1.5 Z" fill="#3A3A3A" stroke="#FF8C00" stroke-width="0.8"/>

    <!-- Horizontal stabilizer -->
    <path d="M-23,0 L-26,-4 L-20,-3 L-20,0 Z" fill="#444" stroke="#FF6B00" stroke-width="0.7"/>
    <path d="M-23,0 L-26,4 L-20,3 L-20,0 Z" fill="#444" stroke="#FF6B00" stroke-width="0.7"/>

    <!-- Vertical stabilizer -->
    <path d="M-23,0 L-26,-5 L-20,-2 Z" fill="#444" stroke="#FF8C00" stroke-width="0.7"/>

    <!-- Engine pods -->
    <ellipse cx="5" cy="-6" rx="4" ry="1.5" fill="#333" stroke="#FF8C00" stroke-width="0.5"/>
    <ellipse cx="5" cy="6" rx="4" ry="1.5" fill="#333" stroke="#FF8C00" stroke-width="0.5"/>

    <!-- Afterburner flames -->
    <ellipse cx="0" cy="-6" rx="3" ry="1" fill="#FF6B00" opacity="0.9">
      <animate attributeName="rx" values="2;4;2" dur="0.15s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="0.15s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="6" rx="3" ry="1" fill="#FF6B00" opacity="0.9">
      <animate attributeName="rx" values="2;4;2" dur="0.15s" begin="0.07s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="0.15s" begin="0.07s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Cockpit -->
    <ellipse cx="21" cy="0" rx="3.5" ry="1.8" fill="#1a1a1a" stroke="#FFAA00" stroke-width="0.6"/>
  </g>

  <!-- Runway edge lights -->
  <circle cx="10" cy="60" r="1.5" fill="#FFAA00">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="10" cy="70" r="1.5" fill="#FFAA00">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1s" begin="0.15s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="60" r="1.5" fill="#FFAA00">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="70" r="1.5" fill="#FFAA00">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1s" begin="0.45s" repeatCount="indefinite"/>
  </circle>
  <circle cx="110" cy="60" r="1.5" fill="#FFAA00">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="110" cy="70" r="1.5" fill="#FFAA00">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1s" begin="0.75s" repeatCount="indefinite"/>
  </circle>

  <!-- Smoke puffs at takeoff point -->
  <circle cx="230" cy="62" r="4" fill="#FF8C00" opacity="0.15">
    <animate attributeName="r" values="3;8;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0;0.2" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="245" cy="60" r="3" fill="#FF6B00" opacity="0.1">
    <animate attributeName="r" values="2;6;2" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0;0.15" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
</svg>