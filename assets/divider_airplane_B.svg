<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" width="800" height="80">
  <defs>
    <linearGradient id="trailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B00;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:0.8"/>
    </linearGradient>
    <filter id="glowPlane2">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ground/horizon line -->
  <line x1="0" y1="75" x2="800" y2="75" stroke="#FF6B00" stroke-width="1" opacity="0.3"/>

  <!-- City silhouette (tiny buildings) -->
  <rect x="30" y="65" width="8" height="10" fill="#FF6B00" opacity="0.2"/>
  <rect x="42" y="60" width="6" height="15" fill="#FF6B00" opacity="0.15"/>
  <rect x="52" y="63" width="10" height="12" fill="#FF6B00" opacity="0.2"/>
  <rect x="70" y="58" width="5" height="17" fill="#FF6B00" opacity="0.15"/>
  <rect x="80" y="62" width="8" height="13" fill="#FF6B00" opacity="0.2"/>
  <rect x="700" y="65" width="8" height="10" fill="#FF6B00" opacity="0.2"/>
  <rect x="715" y="60" width="6" height="15" fill="#FF6B00" opacity="0.15"/>
  <rect x="730" y="63" width="10" height="12" fill="#FF6B00" opacity="0.2"/>
  <rect x="750" y="58" width="5" height="17" fill="#FF6B00" opacity="0.15"/>

  <!-- Contrail / vapor trail -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-900,0;100,0" dur="7s" repeatCount="indefinite"/>
    <!-- Trail fades out behind -->
    <line x1="0" y1="25" x2="700" y2="25" stroke="#FF8C00" stroke-width="1.5" opacity="0.4" stroke-dasharray="3 6"/>
    <line x1="0" y1="28" x2="700" y2="28" stroke="#FF6B00" stroke-width="1" opacity="0.3" stroke-dasharray="2 8"/>

    <!-- Jet airplane -->
    <g transform="translate(700, 20)" filter="url(#glowPlane2)">
      <!-- Fuselage -->
      <path d="M0,5 L35,4 L40,5 L35,6 L0,5 Z" fill="#2D2D2D" stroke="#FF6B00" stroke-width="1.2"/>
      <!-- Main wings (swept back) -->
      <path d="M10,4 L20,-5 L28,-5 L22,4 Z" fill="#3A3A3A" stroke="#FF8C00" stroke-width="0.8"/>
      <path d="M10,6 L20,15 L28,15 L22,6 Z" fill="#3A3A3A" stroke="#FF8C00" stroke-width="0.8"/>
      <!-- Tail fin -->
      <path d="M0,5 L-2,0 L4,2 Z" fill="#444" stroke="#FF6B00" stroke-width="0.8"/>
      <!-- Engines (under wings) -->
      <ellipse cx="18" cy="-2" rx="3" ry="1.5" fill="#333" stroke="#FF8C00" stroke-width="0.5"/>
      <ellipse cx="18" cy="12" rx="3" ry="1.5" fill="#333" stroke="#FF8C00" stroke-width="0.5"/>
      <!-- Engine flames -->
      <circle cx="15" cy="-2" r="1.5" fill="#FF6B00">
        <animate attributeName="r" values="1;2.5;1" dur="0.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="0.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="15" cy="12" r="1.5" fill="#FF6B00">
        <animate attributeName="r" values="1;2.5;1" dur="0.2s" begin="0.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="0.2s" begin="0.1s" repeatCount="indefinite"/>
      </circle>
      <!-- Cockpit window -->
      <ellipse cx="36" cy="5" rx="3" ry="1.5" fill="#1a1a1a" stroke="#FFAA00" stroke-width="0.5"/>
      <!-- Navigation lights -->
      <circle cx="27" cy="-5" r="1" fill="#FF3300">
        <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="27" cy="15" r="1" fill="#00FF00">
        <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Clouds (subtle) -->
  <ellipse cx="300" cy="20" rx="25" ry="8" fill="#FF6B00" opacity="0.08"/>
  <ellipse cx="500" cy="35" rx="30" ry="10" fill="#FF8C00" opacity="0.06"/>
  <ellipse cx="650" cy="15" rx="20" ry="7" fill="#FFAA00" opacity="0.07"/>
</svg>