<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300">
  <defs>
    <filter id="glowCollab">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="radarGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF6B00;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#FF6B00;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background panel -->
  <rect x="2" y="2" width="696" height="296" rx="8" fill="#0d1117" stroke="#FF6B00" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner brackets -->
  <path d="M2,20 L2,2 L20,2" fill="none" stroke="#FF8C00" stroke-width="3" filter="url(#glowCollab)"/>
  <path d="M680,2 L698,2 L698,20" fill="none" stroke="#FF8C00" stroke-width="3" filter="url(#glowCollab)"/>
  <path d="M2,278 L2,298 L20,298" fill="none" stroke="#FF8C00" stroke-width="3" filter="url(#glowCollab)"/>
  <path d="M680,298 L698,298 L698,278" fill="none" stroke="#FF8C00" stroke-width="3" filter="url(#glowCollab)"/>

  <!-- Radar circles (background) -->
  <circle cx="600" cy="180" r="60" fill="none" stroke="#FF6B00" stroke-width="0.5" opacity="0.2"/>
  <circle cx="600" cy="180" r="40" fill="none" stroke="#FF6B00" stroke-width="0.5" opacity="0.3"/>
  <circle cx="600" cy="180" r="20" fill="none" stroke="#FF6B00" stroke-width="0.5" opacity="0.4"/>

  <!-- Radar sweep -->
  <g transform="translate(600, 180)">
    <animateTransform attributeName="transform" type="rotate" from="0 600 180" to="360 600 180" dur="4s" repeatCount="indefinite"/>
    <line x1="0" y1="0" x2="60" y2="0" stroke="#FF8C00" stroke-width="1.5" opacity="0.8"/>
    <path d="M0,0 L55,-15 L60,0 Z" fill="url(#radarGrad)"/>
  </g>

  <!-- Radar blips -->
  <circle cx="580" cy="160" r="3" fill="#00FF88" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="200" r="2.5" fill="#00FF88" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="4s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="570" cy="195" r="2" fill="#00FF88" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="4s" begin="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- OPEN beacon -->
  <circle cx="30" cy="28" r="6" fill="#00FF88" filter="url(#glowCollab)">
    <animate attributeName="r" values="4;7;4" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="50" y="33" font-family="monospace" font-size="11" fill="#00FF88" font-weight="bold">OPEN FOR COLLABORATION</text>

  <!-- Header -->
  <text x="350" y="33" font-family="monospace" font-size="14" fill="#FF8C00" text-anchor="middle" font-weight="bold" filter="url(#glowCollab)">
    ─── COLLABORATION HUB ───
  </text>

  <!-- Separator -->
  <line x1="30" y1="50" x2="670" y2="50" stroke="#FF6B00" stroke-width="0.8" opacity="0.5"/>

  <!-- Item 1: Renewable Energy -->
  <g>
    <rect x="40" y="65" width="500" height="35" rx="4" fill="#0d1117" stroke="#FF6B00" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="5s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <circle cx="55" cy="82" r="5" fill="none" stroke="#FF8C00" stroke-width="1.5">
      <animate attributeName="stroke" values="#FF8C00;#00FF88;#FF8C00" dur="5s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="55" cy="82" r="2" fill="#FF6B00">
      <animate attributeName="fill" values="#FF6B00;#00FF88;#FF6B00" dur="5s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <text x="75" y="87" font-family="monospace" font-size="13" fill="#ffffff">Renewable Energy Projects</text>
  </g>

  <!-- Item 2: Turbomachinery -->
  <g>
    <rect x="40" y="108" width="500" height="35" rx="4" fill="#0d1117" stroke="#FF6B00" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="5s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <circle cx="55" cy="125" r="5" fill="none" stroke="#FF8C00" stroke-width="1.5">
      <animate attributeName="stroke" values="#FF8C00;#00FF88;#FF8C00" dur="5s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="55" cy="125" r="2" fill="#FF6B00">
      <animate attributeName="fill" values="#FF6B00;#00FF88;#FF6B00" dur="5s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <text x="75" y="130" font-family="monospace" font-size="13" fill="#ffffff">Turbomachinery Research</text>
  </g>

  <!-- Item 3: CAD/CAE -->
  <g>
    <rect x="40" y="151" width="500" height="35" rx="4" fill="#0d1117" stroke="#FF6B00" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="5s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <circle cx="55" cy="168" r="5" fill="none" stroke="#FF8C00" stroke-width="1.5">
      <animate attributeName="stroke" values="#FF8C00;#00FF88;#FF8C00" dur="5s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="55" cy="168" r="2" fill="#FF6B00">
      <animate attributeName="fill" values="#FF6B00;#00FF88;#FF6B00" dur="5s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <text x="75" y="173" font-family="monospace" font-size="13" fill="#ffffff">CAD/CAE Simulation Work</text>
  </g>

  <!-- Item 4: Safety -->
  <g>
    <rect x="40" y="194" width="500" height="35" rx="4" fill="#0d1117" stroke="#FF6B00" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="5s" begin="3s" repeatCount="indefinite"/>
    </rect>
    <circle cx="55" cy="211" r="5" fill="none" stroke="#FF8C00" stroke-width="1.5">
      <animate attributeName="stroke" values="#FF8C00;#00FF88;#FF8C00" dur="5s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="55" cy="211" r="2" fill="#FF6B00">
      <animate attributeName="fill" values="#FF6B00;#00FF88;#FF6B00" dur="5s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <text x="75" y="216" font-family="monospace" font-size="13" fill="#ffffff">Industrial Safety &amp; Compliance</text>
  </g>

  <!-- Item 5: Open Source -->
  <g>
    <rect x="40" y="237" width="500" height="35" rx="4" fill="#0d1117" stroke="#FF6B00" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="5s" begin="4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="55" cy="254" r="5" fill="none" stroke="#FF8C00" stroke-width="1.5">
      <animate attributeName="stroke" values="#FF8C00;#00FF88;#FF8C00" dur="5s" begin="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="55" cy="254" r="2" fill="#FF6B00">
      <animate attributeName="fill" values="#FF6B00;#00FF88;#FF6B00" dur="5s" begin="4s" repeatCount="indefinite"/>
    </circle>
    <text x="75" y="259" font-family="monospace" font-size="13" fill="#ffffff">Open Source Engineering Tools</text>
  </g>

  <!-- Connection nodes (right side decorative) -->
  <circle cx="560" cy="82" r="3" fill="#FF6B00" opacity="0.5">
    <animate attributeName="r" values="2;4;2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <line x1="563" y1="82" x2="580" y2="160" stroke="#FF6B00" stroke-width="0.5" opacity="0.3"/>
  <circle cx="560" cy="125" r="3" fill="#FF8C00" opacity="0.5">
    <animate attributeName="r" values="2;4;2" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <line x1="563" y1="125" x2="585" y2="175" stroke="#FF6B00" stroke-width="0.5" opacity="0.3"/>
  <circle cx="560" cy="168" r="3" fill="#FFAA00" opacity="0.5">
    <animate attributeName="r" values="2;4;2" dur="3s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <line x1="563" y1="168" x2="590" y2="185" stroke="#FF6B00" stroke-width="0.5" opacity="0.3"/>
</svg>