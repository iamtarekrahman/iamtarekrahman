<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320">
  <defs>
    <filter id="glowProj">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B00"/>
      <stop offset="100%" style="stop-color:#FFAA00"/>
    </linearGradient>
  </defs>

  <!-- Background panel -->
  <rect x="2" y="2" width="696" height="316" rx="8" fill="#0d1117" stroke="#FF6B00" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner brackets -->
  <path d="M2,20 L2,2 L20,2" fill="none" stroke="#FF8C00" stroke-width="3" filter="url(#glowProj)"/>
  <path d="M680,2 L698,2 L698,20" fill="none" stroke="#FF8C00" stroke-width="3" filter="url(#glowProj)"/>
  <path d="M2,298 L2,318 L20,318" fill="none" stroke="#FF8C00" stroke-width="3" filter="url(#glowProj)"/>
  <path d="M680,318 L698,318 L698,298" fill="none" stroke="#FF8C00" stroke-width="3" filter="url(#glowProj)"/>

  <!-- Rotating turbine icon (top-right) -->
  <g transform="translate(650, 45)" filter="url(#glowProj)">
    <animateTransform attributeName="transform" type="rotate" from="0 650 45" to="360 650 45" dur="5s" repeatCount="indefinite"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#FF6B00" stroke-width="1"/>
    <path d="M0,-12 C5,-5 5,5 0,12" fill="none" stroke="#FF8C00" stroke-width="1.5"/>
    <path d="M0,-12 C-5,-5 -5,5 0,12" fill="none" stroke="#FF8C00" stroke-width="1.5"/>
    <path d="M-12,0 C-5,5 5,5 12,0" fill="none" stroke="#FF8C00" stroke-width="1.5"/>
    <path d="M-12,0 C-5,-5 5,-5 12,0" fill="none" stroke="#FF8C00" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#FF6B00"/>
  </g>

  <!-- Status light -->
  <circle cx="30" cy="30" r="5" fill="#00FF88" filter="url(#glowProj)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="45" y="35" font-family="monospace" font-size="10" fill="#00FF88">ONLINE</text>

  <!-- Header -->
  <text x="350" y="35" font-family="monospace" font-size="14" fill="#FF8C00" text-anchor="middle" font-weight="bold" filter="url(#glowProj)">
    ◉ TESLA TURBINE PERFORMANCE ANALYSIS
  </text>
  <text x="350" y="55" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.8">
    Undergraduate Thesis — IUBAT
  </text>

  <!-- Separator line -->
  <line x1="30" y1="65" x2="670" y2="65" stroke="#FF6B00" stroke-width="0.8" opacity="0.5"/>

  <!-- Description (fade in) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.5s" fill="freeze"/>
    <text x="40" y="90" font-family="monospace" font-size="12" fill="#aaaaaa" font-style="italic">
      Designed, fabricated, and tested a bladeless boundary-layer turbine prototype
    </text>
  </g>

  <!-- Parameters section -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1s" fill="freeze"/>
    <text x="40" y="120" font-family="monospace" font-size="12" fill="#FF8C00" font-weight="bold">Parameters Studied:</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.3s" fill="freeze"/>
    <text x="60" y="142" font-family="monospace" font-size="12" fill="#ffffff">├── Inlet Velocity Variation</text>
    <circle cx="50" cy="138" r="2" fill="#FF6B00">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.6s" fill="freeze"/>
    <text x="60" y="162" font-family="monospace" font-size="12" fill="#ffffff">├── Disk Gap Optimization</text>
    <circle cx="50" cy="158" r="2" fill="#FF6B00">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.9s" fill="freeze"/>
    <text x="60" y="182" font-family="monospace" font-size="12" fill="#ffffff">└── Disk Thickness Effects</text>
    <circle cx="50" cy="178" r="2" fill="#FF6B00">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Outputs section -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.2s" fill="freeze"/>
    <text x="40" y="212" font-family="monospace" font-size="12" fill="#FF8C00" font-weight="bold">Outputs Measured:</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.5s" fill="freeze"/>
    <text x="60" y="234" font-family="monospace" font-size="12" fill="#ffffff">├── Torque</text>
    <circle cx="50" cy="230" r="2" fill="#FFAA00">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.8s" fill="freeze"/>
    <text x="60" y="254" font-family="monospace" font-size="12" fill="#ffffff">├── Power</text>
    <circle cx="50" cy="250" r="2" fill="#FFAA00">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.1s" fill="freeze"/>
    <text x="60" y="274" font-family="monospace" font-size="12" fill="#ffffff">└── Efficiency</text>
    <circle cx="50" cy="270" r="2" fill="#FFAA00">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Progress bar -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.5s" fill="freeze"/>
    <text x="40" y="302" font-family="monospace" font-size="12" fill="#FF8C00" font-weight="bold">Status:</text>
    <!-- Background bar -->
    <rect x="110" y="291" width="300" height="14" rx="3" fill="#1a1a1a" stroke="#FF6B00" stroke-width="0.8"/>
    <!-- Fill bar (animates width) -->
    <rect x="112" y="293" width="0" height="10" rx="2" fill="url(#progressGrad)">
      <animate attributeName="width" values="0;296" dur="2s" begin="3.8s" fill="freeze"/>
    </rect>
    <!-- Status text -->
    <text x="425" y="303" font-family="monospace" font-size="11" fill="#00FF88" font-weight="bold">
      COMPLETE
      <animate attributeName="opacity" values="0;0;1" dur="0.1s" begin="5.5s" fill="freeze"/>
    </text>
  </g>
</svg>